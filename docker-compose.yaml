
services:
  claude-agent:
    image: cc-remote-claude-agent
    build: .
    restart: unless-stopped
    tty: true
    stdin_open: true
    environment:
      - GITHUB_REPO=${GITHUB_REPO}
      - GIT_USER_NAME=${GIT_USER_NAME}
      - GIT_USER_EMAIL=${GIT_USER_EMAIL}
      - ANTHROPIC_BASE_URL=${ANTHROPIC_BASE_URL}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - HOME=/home/node
      - SESSION_NAME=${SESSION_NAME}
      - SESSION_UUID=${SESSION_UUID}
      - PERMISSION_MODE=${PERMISSION_MODE:-auto}
      - TMPDIR=/tmp-skills
    volumes:
      - ${PROJECT_PATH}:/workspace
      - ${CLAUDE_CONFIG_PATH}:/home/node/.claude
      - ${CLAUDE_JSON_PATH}:/home/node/.claude.json
      - ./tmp-skills:/tmp-skills

  web-manager:
    build: ./web
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WEB_PORT:-4000}:4000"
    environment:
      - WEB_PORT=4000
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET}
      - ALLOWED_GITHUB_USERS=${ALLOWED_GITHUB_USERS}
      - CLAUDE_CONFIG_PATH=${CLAUDE_CONFIG_PATH}
      - CLAUDE_JSON_PATH=${CLAUDE_JSON_PATH}
      - GIT_USER_NAME=${GIT_USER_NAME}
      - GIT_USER_EMAIL=${GIT_USER_EMAIL}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - PERMISSION_MODE=${PERMISSION_MODE:-auto}
      - AGENT_IMAGE=cc-remote-claude-agent
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

  caddy:
    image: caddy:latest
    restart: unless-stopped
    profiles:
      - caddy
    ports:
      - "${CADDY_HTTP_PORT_BIND:-80:80}"
      - "${CADDY_HTTPS_PORT:-443}:443"
    environment:
      - DOMAIN_NAME=${DOMAIN_NAME}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web-manager

volumes:
  caddy_data:
  caddy_config:





