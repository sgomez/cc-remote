
services:
  claude-agent:
    image: cc-remote-claude-agent
    build: .
    restart: unless-stopped
    tty: true
    stdin_open: true
    environment:
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - GITHUB_REPO=${GITHUB_REPO}
      - GIT_USER_NAME=${GIT_USER_NAME}
      - GIT_USER_EMAIL=${GIT_USER_EMAIL}
      - ANTHROPIC_BASE_URL=${ANTHROPIC_BASE_URL}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - HOME=/home/node
      - SESSION_NAME=${SESSION_NAME}
      - SESSION_UUID=${SESSION_UUID}
      - PERMISSION_MODE=${PERMISSION_MODE:-auto}
      - TMPDIR=/tmp-skills
    volumes:
      - ${PROJECT_PATH}:/workspace
      - ${CLAUDE_CONFIG_PATH}:/home/node/.claude
      - ${CLAUDE_JSON_PATH}:/home/node/.claude.json
      - ./tmp-skills:/tmp-skills

  web-manager:
    build: ./web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-4000}:4000"
    environment:
      - WEB_PORT=4000
      - WEB_PASSWORD=${WEB_PASSWORD}
      - OTP_SECRET=${OTP_SECRET}
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - CLAUDE_CONFIG_PATH=${CLAUDE_CONFIG_PATH}
      - CLAUDE_JSON_PATH=${CLAUDE_JSON_PATH}
      - GIT_USER_NAME=${GIT_USER_NAME}
      - GIT_USER_EMAIL=${GIT_USER_EMAIL}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - PERMISSION_MODE=${PERMISSION_MODE:-auto}
      - AGENT_IMAGE=cc-remote-claude-agent
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

  headroom:
    image: ghcr.io/chopratejas/headroom:latest
    restart: unless-stopped
    profiles:
      - headroom
    ports:
      - "127.0.0.1:${HEADROOM_HOST_PORT:-8787}:8787"
    volumes:
      - ${HEADROOM_CONFIG_PATH}:/root/.headroom





