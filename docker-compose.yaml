
services:
  # The claude-agent image every Session (and every clone / login helper) runs.
  # This service exists ONLY to build that image: web-manager creates agent
  # containers as siblings through the socket proxy, so compose must never start
  # one itself — hence `replicas: 0`. It deliberately has NO profile: a profiled
  # service is skipped by `docker compose build`, which is what used to leave a
  # fresh deployment without the agent image unless someone ran the (now removed)
  # manual `--profile agent` flow.
  claude-agent:
    image: cc-remote-claude-agent
    build: .
    deploy:
      replicas: 0

  docker-socket-proxy:
    # TODO: pin to a specific digest for reproducibility once vetted (tag pinned to v0.4.2 for now)
    image: tecnativa/docker-socket-proxy:v0.4.2
    restart: unless-stopped
    environment:
      - CONTAINERS=1
      - VOLUMES=1
      - POST=1
      # EXEC gates /exec/{id}/start|json — needed by the workspace git probe
      # (uncommitted-work guard before destroy/reset). Creating the exec is a
      # /containers route, but starting it is not; without this it 403s.
      - EXEC=1
      - IMAGES=0
      - NETWORKS=0
      - BUILD=0
      - INFO=0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    # No ports are published to the host; only reachable from other services on the
    # compose network (e.g. web-manager via DOCKER_HOST=tcp://docker-socket-proxy:2375).

  # web-manager: the TanStack Start + Nitro app (webapp/). ONE service, ONE
  # Caddy upstream — it serves static + SSR + API + SSE + WS on port 4000, so
  # Caddy needs no WebSocket stanza (it proxies upgrades by default). Runs
  # unprivileged: it reaches Docker only through docker-socket-proxy over TCP,
  # never a mounted socket.
  web-manager:
    # Build context is the repo root (monorepo): the pnpm workspace manifest and
    # the single lockfile live there; the Dockerfile stays under webapp/.
    build:
      context: .
      dockerfile: webapp/Dockerfile
    image: cc-remote-web-manager
    restart: unless-stopped
    depends_on:
      - docker-socket-proxy
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:${WEB_PORT:-4000}:4000"
    environment:
      - PORT=4000
      # Auth (better-auth): base URL, stable signing secret, GitHub OAuth app,
      # fail-closed allow-list.
      - BETTER_AUTH_URL=${BETTER_AUTH_URL}
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET}
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET}
      - ALLOWED_GITHUB_USERS=${ALLOWED_GITHUB_USERS}
      # Docker adapter: reach the daemon via the proxy; created sibling agent
      # containers join THIS compose network so the WS proxy can dial them by name.
      - DOCKER_HOST=tcp://docker-socket-proxy:2375
      - AGENT_IMAGE=cc-remote-claude-agent
      - AGENT_NETWORK=cc-remote
      - AGENT_PIDS_LIMIT=${AGENT_PIDS_LIMIT:-4096}
      - PERMISSION_MODE=${PERMISSION_MODE:-auto}
      - GIT_USER_NAME=${GIT_USER_NAME}
      - GIT_USER_EMAIL=${GIT_USER_EMAIL}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      # SQLite (domain + better-auth tables) on a persisted named volume so
      # Accounts and auth sessions survive `docker compose down && up`.
      - DATABASE_PATH=/data/cc-remote.db
      # `debug` library namespaces (silent unless set). Dev: DEBUG=cc-remote:*
      - DEBUG=${DEBUG:-}
    volumes:
      - cc-remote-db:/data

  caddy:
    image: caddy:2
    restart: unless-stopped
    profiles:
      - caddy
    ports:
      - "${CADDY_HTTP_PORT_BIND:-80:80}"
      - "${CADDY_HTTPS_PORT:-443}:443"
    environment:
      - DOMAIN_NAME=${DOMAIN_NAME}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web-manager

# Deterministic network name (independent of the compose project/dir name) so
# the Docker adapter can attach created agent containers to it via AGENT_NETWORK.
networks:
  default:
    name: cc-remote

volumes:
  caddy_data:
  caddy_config:
  # SQLite database + WAL sidecars (Accounts, settings, better-auth sessions).
  cc-remote-db:
